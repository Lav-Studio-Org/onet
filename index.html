<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Onet: Sambung Gambar</title>
  <meta name="description" content="Game Onet klasik: sambungkan dua gambar yang sama dengan garis maksimal dua belokan. Lima tingkat kesulitan, dari Sangat Mudah sampai Sangat Sulit.">
  <meta name="theme-color" content="#0f3d3e">
  <meta property="og:title" content="Onet: Sambung Gambar">
  <meta property="og:description" content="Sambungkan gambar yang sama, maksimal dua belokan. Berani coba Sangat Sulit?">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Onet">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body class="at-home">
  <!-- UI icon set: 24px grid, 2px rounded strokes, one accent fill (--acc). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-help" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" style="fill:var(--acc)"/><path d="M9.4 9.3a2.7 2.7 0 1 1 3.8 2.5c-.8.4-1.2 1-1.2 1.8v.6"/><circle cx="12" cy="17.2" r="1.2" fill="currentColor" stroke="none"/></g></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M18.93 9.39 21.8 10v4l-2.87.62-.19.44 1.59 2.48-2.8 2.8-2.48-1.59-.44.19L14 21.8h-4l-.61-2.87-.44-.19-2.48 1.59-2.8-2.8 1.59-2.48-.19-.44L2.2 14v-4l2.87-.61.19-.44-1.59-2.48 2.8-2.8 2.48 1.59.44-.19L10 2.2h4l.61 2.87.44.19 2.48-1.59 2.8 2.8-1.59 2.48z" style="fill:var(--acc)"/><circle cx="12" cy="12" r="3"/></g></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1.2 1.2 0 0 0 1.8 1l10.3-6.4a1.2 1.2 0 0 0 0-2L9.8 4.6A1.2 1.2 0 0 0 8 5.6z" fill="currentColor"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5.5" width="13.5" height="13" rx="3" style="fill:var(--acc)"/><path d="M16 10.4l5-3v9.2l-5-3z"/><path d="M7.6 9.4v5.2l4.2-2.6z" fill="currentColor" stroke="none"/></g></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" style="fill:var(--acc)"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.4a8 8 0 0 1 0 11.2"/></g></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5V6l10-2.5V15"/><circle cx="6.5" cy="17.5" r="2.6" style="fill:var(--acc)"/><circle cx="16.4" cy="15" r="2.6" style="fill:var(--acc)"/></g></symbol>
      <symbol id="i-vibe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3.5" width="8" height="17" rx="2.2" style="fill:var(--acc)"/><path d="M4.6 8.5v7M19.4 8.5v7M1.8 10.5v3M22.2 10.5v3"/></g></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11 12 4l8 7v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" style="fill:var(--acc)"/></g></symbol>
      <symbol id="i-restart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 12.5a7.5 7.5 0 1 0 2.4-6.1"/><path d="M4.5 3.8v4.4h4.4"/></g></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8.3 10.8l7.4-4M8.3 13.2l7.4 4"/><circle cx="18" cy="5.5" r="2.6" style="fill:var(--acc)"/><circle cx="6" cy="12" r="2.6" style="fill:var(--acc)"/><circle cx="18" cy="18.5" r="2.6" style="fill:var(--acc)"/></g></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.8h10V9a5 5 0 0 1-10 0z" style="fill:var(--acc)"/><path d="M7 5.8H4.4A2.6 2.6 0 0 0 7.3 9.6M17 5.8h2.6a2.6 2.6 0 0 1-2.9 3.8M12 14v3.4M8.5 20.5h7M9.6 20.5l.6-3h3.6l.6 3"/></g></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.6l4.4 4.4L19 7.4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="10" rx="2.4" style="fill:var(--acc)"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></g></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 2.5c.8 4.8 2.7 6.7 7.5 7.5-4.8.8-6.7 2.7-7.5 7.5-.8-4.8-2.7-6.7-7.5-7.5 4.8-.8 6.7-2.7 7.5-7.5zM19 15.5c.4 2 1 2.7 3 3-2 .4-2.6 1-3 3-.4-2-1-2.6-3-3 2-.3 2.6-1 3-3z" fill="currentColor"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 21.5c-4 0-7-2.8-7-6.6 0-3.3 2.3-5.4 3.6-7.6.4 1.6 1.3 2.6 2.4 3C11 7 12.6 4.3 15 2.5c-.3 3.3 4 6.2 4 11.4 0 4.4-3 7.6-7 7.6z" fill="currentColor"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2.5 4.5 13.5h6.5l-1 8 9-11h-6.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8a6.6 6.6 0 0 0-3.9 11.9c.6.5.9 1.1.9 1.8v.8h6v-.8c0-.7.3-1.3.9-1.8A6.6 6.6 0 0 0 12 2.8z" style="fill:var(--acc)"/><path d="M9.5 20.2h5M10.5 22.2h3"/></g></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c5 0 6 10 11 10H21M3 17h3.5c2 0 3.2-1.6 4.2-3.5M21 7h-3.5c-2 0-3.2 1.6-4.2 3.5"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/></g></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8" style="fill:var(--acc)"/><path d="M12 9v4.4l2.8 1.8M9.5 2.5h5"/></g></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1.6" style="fill:var(--acc)"/><rect x="15" y="15" width="6" height="6" rx="1.6" style="fill:var(--acc)"/><path d="M9 6h6.5a2.5 2.5 0 0 1 2.5 2.5V15"/></g></symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- ---------- HUD (in game) ---------- -->
    <header id="hud" class="play-only">
      <button class="icon-btn" id="btn-pause" aria-label="Jeda"><svg class="ic"><use href="#i-pause"/></svg></button>
      <div class="hud-mid">
        <div class="hud-row">
          <span class="chip" id="hud-diff">Sedang</span>
          <span class="stage" id="hud-stage">Babak 1/5</span>
        </div>
        <div class="timebar" id="timebar"><i id="timefill"></i></div>
      </div>
      <div class="stat score">
        <span class="label">Skor</span>
        <span class="value" id="hud-score">0</span>
      </div>
    </header>

    <!-- ---------- Board ---------- -->
    <main id="stage">
      <div id="board" aria-label="Papan permainan">
        <div id="tiles"></div>
        <svg id="lines" aria-hidden="true"></svg>
        <div id="fx"></div>
      </div>
      <div id="combo" aria-live="polite"></div>
      <div id="toast" aria-live="polite"></div>
    </main>

    <!-- ---------- Dock (in game) ---------- -->
    <footer id="dock" class="play-only">
      <button class="pw" id="btn-hint"><svg class="ic" style="--acc:#ffd23f"><use href="#i-bulb"/></svg><span>Petunjuk</span><em class="pc" id="hint-count">3</em></button>
      <div class="timer-pill"><svg class="ic" style="--acc:#9ef0d8"><use href="#i-clock"/></svg><b id="hud-time">0:00</b></div>
      <button class="pw" id="btn-shuffle"><svg class="ic"><use href="#i-shuffle"/></svg><span>Acak</span><em class="pc" id="shuffle-count">2</em></button>
    </footer>

    <!-- ---------- Home ---------- -->
    <section id="home" class="screen home-only">
      <div class="logo">
        <div class="logo-tiles" id="logo-tiles"></div>
        <h1>Onet</h1>
        <p class="tagline">Sambung gambar yang sama, maksimal 2 belokan</p>
      </div>
      <div class="diff-list" id="diff-list"></div>
      <nav class="home-nav">
        <button class="icon-btn" id="btn-help" aria-label="Cara main"><svg class="ic" style="--acc:#9ef0d8"><use href="#i-help"/></svg></button>
        <button class="icon-btn" id="btn-settings" aria-label="Pengaturan"><svg class="ic" style="--acc:#9ef0d8"><use href="#i-gear"/></svg></button>
      </nav>
    </section>
  </div>

  <!-- ---------- Modals ---------- -->
  <div class="overlay" id="modal-pause">
    <div class="card">
      <h2>Jeda</h2>
      <p class="lead" id="pause-info"></p>
      <div class="btn-col">
        <button class="btn primary" id="btn-resume"><svg class="ic"><use href="#i-play"/></svg>Lanjut</button>
        <button class="btn" id="btn-restart"><svg class="ic"><use href="#i-restart"/></svg>Ulangi babak</button>
        <button class="btn" id="btn-quit"><svg class="ic" style="--acc:#9ef0d8"><use href="#i-home"/></svg>Menu utama</button>
      </div>
      <div class="toggles" id="pause-toggles"></div>
    </div>
  </div>

  <div class="overlay" id="modal-clear">
    <div class="card">
      <div class="ribbon">Babak selesai!</div>
      <div class="stars" id="clear-stars"></div>
      <div class="tally" id="clear-tally"></div>
      <div class="btn-col">
        <button class="btn primary" id="btn-next"><svg class="ic"><use href="#i-play"/></svg>Babak berikutnya</button>
        <button class="btn ghost" id="btn-clear-home"><svg class="ic" style="--acc:#9ef0d8"><use href="#i-home"/></svg>Menu utama</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal-timeup">
    <div class="card">
      <div class="big-ic warn"><svg class="ic" style="--acc:#ffb4a8"><use href="#i-clock"/></svg></div>
      <h2>Waktu habis!</h2>
      <p class="lead" id="timeup-info"></p>
      <div class="btn-col">
        <button class="btn ad" id="btn-revive"><svg class="ic" style="--acc:#bbf7d0"><use href="#i-video"/></svg>Tonton iklan, +30 detik</button>
        <button class="btn" id="btn-giveup">Selesai</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal-over">
    <div class="card">
      <div class="big-ic" id="over-ic"></div>
      <h2 id="over-title">Permainan selesai</h2>
      <p class="lead" id="over-sub"></p>
      <div class="final">
        <span class="label">Skor akhir</span>
        <span class="value" id="over-score">0</span>
        <span class="best" id="over-best"></span>
      </div>
      <div class="btn-col">
        <button class="btn primary" id="btn-again"><svg class="ic"><use href="#i-restart"/></svg>Main lagi</button>
        <button class="btn" id="btn-share"><svg class="ic" style="--acc:#9ef0d8"><use href="#i-share"/></svg>Bagikan skor</button>
        <button class="btn ghost" id="btn-over-home"><svg class="ic" style="--acc:#9ef0d8"><use href="#i-home"/></svg>Menu utama</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal-refill">
    <div class="card">
      <div class="big-ic" id="refill-ic"></div>
      <h2 id="refill-title">Petunjuk habis</h2>
      <p class="lead" id="refill-sub"></p>
      <div class="btn-col">
        <button class="btn ad" id="btn-refill"><svg class="ic" style="--acc:#bbf7d0"><use href="#i-video"/></svg><span id="refill-cta">Tonton iklan</span></button>
        <button class="btn ghost" id="btn-refill-no">Nanti saja</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal-settings">
    <div class="card">
      <button class="x-btn" data-close aria-label="Tutup"><svg class="ic"><use href="#i-close"/></svg></button>
      <h2>Pengaturan</h2>
      <div class="toggles" id="settings-toggles"></div>
      <p class="hint">Onet v1.0. Dibuat dengan HTML, tanpa pelacak.</p>
    </div>
  </div>

  <div class="overlay" id="modal-help">
    <div class="card wide">
      <button class="x-btn" data-close aria-label="Tutup"><svg class="ic"><use href="#i-close"/></svg></button>
      <h2>Cara main</h2>
      <div class="howto" id="howto"></div>
      <button class="btn primary" data-close>Mengerti</button>
    </div>
  </div>

  <script src="js/tiles.js"></script>
  <script src="js/board.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
